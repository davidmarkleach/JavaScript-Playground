name: Deploy to GitHub Pages

on:
  push:
    branches:
      # The github-pages environment only permits deployments from
      # Second-JavaScript-Playground, so pushes to any other branch build
      # fine but fail at actions/deploy-pages. Add a branch here only after
      # allowing it under Settings > Environments > github-pages.
      - Second-JavaScript-Playground
      - claude/food-puzzle-app-8ov90c
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            if-then-engine/package-lock.json
            intention-engine/package-lock.json

      - name: Build the IF-THEN Intention Engine (Vite)
        working-directory: if-then-engine
        run: |
          npm ci
          npm run build

      - name: Build the Intention Engine (Next.js static export)
        working-directory: intention-engine
        run: |
          npm ci
          npm run build

      # The static pages ship as-is; each app is built and layered in as its
      # own subdirectory so everything lives under the same Pages site.
      - name: Assemble site
        run: |
          mkdir -p _site
          tar -cf - \
            --exclude='./_site' \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./if-then-engine' \
            --exclude='./intention-engine' \
            . | tar -xf - -C _site
          mkdir -p _site/if-then-engine _site/intention-engine
          cp -r if-then-engine/dist/. _site/if-then-engine/
          cp -r intention-engine/out/. _site/intention-engine/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
